apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-webapp
  namespace: edge-production
  labels:
    app.kubernetes.io/name: portfolio-webapp
    app.kubernetes.io/part-of: homelab-cluster
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: portfolio-webapp
  template:
    metadata:
      labels:
        app: portfolio-webapp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: web
        image: ghcr.io/brian-e-ramirez-zea/portfolio-webapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "16Mi"
            cpu: "20m"
          limits:
            memory: "32Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
      volumes:
      - name: tmp-dir
        emptyDir:
          medium: Memory
          sizeLimit: 4Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: edge-production
  labels:
    app: portfolio-webapp
spec:
  type: ClusterIP
  selector:
    app: portfolio-webapp
  ports:
  - port: 80
    targetPort: 8080
    name: http
    protocol: TCP
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: frontend-quota
  namespace: edge-production
spec:
  hard:
    requests.cpu: "200m"
    requests.memory: 64Mi
    limits.cpu: "500m"
    limits.memory: 128Mi
    pods: "4"

