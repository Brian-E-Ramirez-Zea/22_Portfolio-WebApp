apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: portfolio-production
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: portfolio
  sourceRef:
    kind: GitRepository
    name: unifiedvault-monorepo
  path: ./k8s/apps/portfolio/overlays/prod
  prune: true
  wait: true
  timeout: 3m
